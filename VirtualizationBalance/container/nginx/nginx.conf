worker_processes 1;
events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    upstream tomcat {
        server tomcat1:8080;
        server tomcat2:8080;
    }

    server {
        listen 80;
        server_name localhost kylinos.internal;

        location / {
            proxy_pass http://tomcat;
        }
    }
}